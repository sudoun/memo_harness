<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Posterior Memory Harness reconciliation pipeline</title>
  <desc id="desc">Noisy observations flow through posterior inference, relation laws, and lineage deduplication to produce an auditable evidence capsule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M0 92H1200M0 428H1200" stroke="#20304b" stroke-width="1"/>

  <text x="600" y="56" fill="#f8fafc" font-size="27" font-weight="700" text-anchor="middle" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">From noisy observations to auditable evidence</text>
  <text x="600" y="84" fill="#94a3b8" font-size="17" text-anchor="middle" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">从噪声观测到可审计证据</text>

  <!-- Stage 1 -->
  <g transform="translate(48 122)">
    <rect width="286" height="262" rx="22" fill="#0d192a" stroke="#29405d" stroke-width="2"/>
    <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="700" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">1 · Noisy observations</text>
    <text x="24" y="64" fill="#94a3b8" font-size="15" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">不确定、重复与冲突的观测</text>

    <g transform="translate(22 86)">
      <rect width="242" height="42" rx="10" fill="#10283b" stroke="#38bdf8"/>
      <circle cx="20" cy="21" r="6" fill="#38bdf8"/>
      <text x="36" y="18" fill="#dbeafe" font-size="13" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">tool state · phase 1 · 0.92</text>
      <text x="36" y="34" fill="#7dd3fc" font-size="11" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">工具状态 · 阶段 1</text>
    </g>
    <g transform="translate(22 140)">
      <rect width="242" height="42" rx="10" fill="#2a2114" stroke="#f59e0b"/>
      <circle cx="20" cy="21" r="6" fill="#f59e0b"/>
      <text x="36" y="18" fill="#fef3c7" font-size="13" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">retry · same source event</text>
      <text x="36" y="34" fill="#fcd34d" font-size="11" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">重试 · 同一来源事件</text>
    </g>
    <g transform="translate(22 194)">
      <rect width="242" height="42" rx="10" fill="#271827" stroke="#c084fc"/>
      <circle cx="20" cy="21" r="6" fill="#c084fc"/>
      <text x="36" y="18" fill="#f3e8ff" font-size="13" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">correction · newer evidence</text>
      <text x="36" y="34" fill="#d8b4fe" font-size="11" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">纠正 · 更新证据</text>
    </g>
  </g>

  <path d="M350 253H414" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g transform="translate(430 122)">
    <rect width="340" height="262" rx="22" fill="#0d192a" stroke="#315271" stroke-width="2"/>
    <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="700" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">2 · Reconciliation harness</text>
    <text x="24" y="64" fill="#94a3b8" font-size="15" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">后验推断与全局一致性协调</text>

    <g transform="translate(28 78)">
      <circle cx="142" cy="78" r="62" fill="#0b2235" stroke="url(#cyan)" stroke-width="2"/>
      <circle cx="142" cy="78" r="44" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 7"/>
      <path d="M104 84L132 55L167 70L184 102L132 111Z" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <circle cx="104" cy="84" r="7" fill="#38bdf8"/>
      <circle cx="132" cy="55" r="7" fill="#f59e0b"/>
      <circle cx="167" cy="70" r="7" fill="#38bdf8"/>
      <circle cx="184" cy="102" r="7" fill="#f59e0b"/>
      <circle cx="132" cy="111" r="7" fill="#c084fc"/>
      <circle cx="142" cy="78" r="13" fill="#e2f7ff" filter="url(#glow)"/>
    </g>
    <text x="170" y="226" fill="#dbeafe" font-size="13" text-anchor="middle" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">posterior + relation law + lineage dedup</text>
    <text x="170" y="246" fill="#7dd3fc" font-size="12" text-anchor="middle" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">后验 + 关系律 + 谱系去重</text>
  </g>

  <path d="M786 253H850" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g transform="translate(866 122)">
    <rect width="286" height="262" rx="22" fill="#0d192a" stroke="#2f7182" stroke-width="2"/>
    <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="700" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">3 · Evidence capsule</text>
    <text x="24" y="64" fill="#94a3b8" font-size="15" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">一致、可追溯的证据胶囊</text>
    <g transform="translate(44 89)">
      <rect width="198" height="126" rx="34" fill="#0b2638" stroke="#67e8f9" stroke-width="2"/>
      <path d="M55 71L91 41L129 60L151 91L99 101Z" fill="none" stroke="#67e8f9" stroke-width="2.5"/>
      <circle cx="55" cy="71" r="7" fill="#38bdf8"/>
      <circle cx="91" cy="41" r="7" fill="#38bdf8"/>
      <circle cx="129" cy="60" r="7" fill="#38bdf8"/>
      <circle cx="151" cy="91" r="7" fill="#38bdf8"/>
      <circle cx="99" cy="101" r="7" fill="#38bdf8"/>
      <circle cx="172" cy="25" r="17" fill="#083344" stroke="#67e8f9" stroke-width="2"/>
      <path d="M164 25L170 31L181 18" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="143" y="232" fill="#dbeafe" font-size="13" text-anchor="middle" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">beliefs · conflicts · observation IDs</text>
    <text x="143" y="250" fill="#7dd3fc" font-size="12" text-anchor="middle" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">信念 · 冲突 · 观测 ID</text>
  </g>

  <text x="600" y="468" fill="#cbd5e1" font-size="15" text-anchor="middle" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">Typed evidence, never instructions · 类型化证据，而非可执行指令</text>
</svg>
